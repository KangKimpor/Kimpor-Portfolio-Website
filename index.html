  <!-- ===== Critical CSS Inlined (Above-the-fold, Performance!) ===== -->
  <style>
    /* Performance critical styles - inlined for faster first paint */
    html { scroll-behavior: smooth; font-size: 100%; }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    
    /* Large text support for low vision users */
    @media (prefers-large-targets: fine) {
      body { font-size: 115%; line-height: 1.8; }
    }
    
    /* High contrast mode support */
    @media (prefers-contrast: more) {
      body { background-color: #ffffff !important; color: #000000 !important; }
      .btn-primary { background-color: #007bff !important; border-width: 2px !important; }
    }
    
    /* Skip link for keyboard navigation */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      padding: 8px 16px;
      background: #007bff;
      color: white;
      text-decoration: none;
      z-index: 10000;
      transition: top 0.3s ease-out;
    }
    
    .skip-link:focus {
      top: 0;
      outline: 2px solid #0056b3;
      outline-offset: 4px;
      box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.2);
    }
    
    /* Focus indicators for keyboard users */
    *:focus-visible {
      outline: 2px solid #007bff;
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.2);
      border-radius: 2px;
    }
  </style>
